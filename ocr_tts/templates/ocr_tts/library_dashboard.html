<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бібліотека аудіокниг</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .nav-menu {
            max-width: 1400px;
            margin: 0 auto 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 15px 30px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .nav-menu a {
            text-decoration: none;
            color: #667eea;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.3s;
        }
        .nav-menu a:hover {
            background: #667eea;
            color: white;
        }
        .nav-menu a.active {
            background: #667eea;
            color: white;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .search-box {
            flex: 1;
            min-width: 300px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }
        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }
        .filter-buttons {
            display: flex;
            gap: 10px;
        }
        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: #667eea;
            color: white;
        }
        .stats-bar {
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        .book-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .book-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }
        .book-card.complete {
            border-left: 5px solid #28a745;
        }
        .book-card.incomplete {
            border-left: 5px solid #ffc107;
        }
        .book-header {
            margin-bottom: 15px;
        }
        .book-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .book-description {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .book-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .meta-badge {
            background: #f0f0f0;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: #555;
        }
        .meta-badge.language {
            background: #e3f2fd;
            color: #1976d2;
        }
        .meta-badge.provider {
            background: #f3e5f5;
            color: #7b1fa2;
        }
        .progress-section {
            margin-bottom: 15px;
        }
        .progress-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
        }
        .progress-bar {
            background: #e0e0e0;
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            transition: width 0.3s;
        }
        .progress-fill.complete {
            background: #28a745;
        }
        .book-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .action-btn {
            flex: 1;
            min-width: 120px;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }
        .action-btn.primary {
            background: #667eea;
            color: white;
        }
        .action-btn.primary:hover {
            background: #5568d3;
        }
        .action-btn.success {
            background: #28a745;
            color: white;
        }
        .action-btn.success:hover {
            background: #218838;
        }
        .action-btn.secondary {
            background: #f0f0f0;
            color: #333;
        }
        .action-btn.secondary:hover {
            background: #e0e0e0;
        }
        .action-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            margin-top: 10px;
        }
        .status-badge.complete {
            background: #d4edda;
            color: #155724;
        }
        .status-badge.processing {
            background: #fff3cd;
            color: #856404;
        }
        .status-badge.audio-ready {
            background: #d1ecf1;
            color: #0c5460;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .empty-state-text {
            font-size: 18px;
            margin-bottom: 20px;
        }
        .create-btn {
            display: inline-block;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: background 0.3s;
        }
        .create-btn:hover {
            background: #5568d3;
        }
        .book-date {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <nav class="nav-menu">
        <a href="/ocr_tts/dashboard/">📄 Одностороінковий</a>
        <a href="/ocr_tts/multipage/">📚 Багатосторінковий</a>
        <a href="/ocr_tts/library/" class="active">🗂️ Бібліотека</a>
    </nav>

    <div class="container">
        <h1>📚 Бібліотека аудіокниг</h1>
        <p class="subtitle">Всі оброблені документи та аудіокниги</p>

        <div class="header-actions">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Пошук книг...">
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Всі</button>
                <button class="filter-btn" data-filter="complete">Завершені</button>
                <button class="filter-btn" data-filter="processing">В обробці</button>
                <button class="filter-btn" data-filter="audio">З аудіо</button>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-number" id="totalBooks">0</div>
                <div class="stat-label">Всього книг</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="completeBooks">0</div>
                <div class="stat-label">Завершено</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="audioBooks">0</div>
                <div class="stat-label">З аудіо</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="totalPages">0</div>
                <div class="stat-label">Всього сторінок</div>
            </div>
        </div>

        <div id="booksContainer">
            <div class="empty-state">
                <div class="empty-state-icon">📖</div>
                <div class="empty-state-text">Завантаження...</div>
            </div>
        </div>
    </div>

    <script>
        let allBooks = [];
        let currentFilter = 'all';

        // Load books on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadBooks();
            setupFilters();
            setupSearch();
        });

        async function loadBooks() {
            try {
                const response = await fetch('/ocr_tts/api/documents/list/');
                const data = await response.json();

                if (data.success) {
                    allBooks = data.documents;
                    updateStats();
                    renderBooks(allBooks);
                }
            } catch (error) {
                console.error('Error loading books:', error);
                showEmptyState('Помилка завантаження книг');
            }
        }

        function updateStats() {
            const total = allBooks.length;
            const complete = allBooks.filter(b => b.is_complete).length;
            const audio = allBooks.filter(b => b.audio_generated).length;
            const pages = allBooks.reduce((sum, b) => sum + b.total_pages, 0);

            document.getElementById('totalBooks').textContent = total;
            document.getElementById('completeBooks').textContent = complete;
            document.getElementById('audioBooks').textContent = audio;
            document.getElementById('totalPages').textContent = pages;
        }

        function renderBooks(books) {
            const container = document.getElementById('booksContainer');

            if (books.length === 0) {
                showEmptyState('Книг не знайдено');
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'books-grid';

            books.forEach(book => {
                const card = createBookCard(book);
                grid.appendChild(card);
            });

            container.innerHTML = '';
            container.appendChild(grid);
        }

        function createBookCard(book) {
            const card = document.createElement('div');
            const completeClass = book.is_complete ? 'complete' : 'incomplete';
            card.className = `book-card ${completeClass}`;

            const progress = book.total_pages > 0 ? (book.processed_pages / book.total_pages * 100) : 0;
            const progressClass = progress === 100 ? 'complete' : '';

            const languageNames = {
                'uk': 'Українська',
                'en': 'English',
                'ru': 'Русский'
            };

            const providerNames = {
                'gtts': 'Google TTS',
                'gemini': 'Gemini TTS'
            };

            let statusBadge = '';
            if (book.audio_generated) {
                statusBadge = '<span class="status-badge audio-ready">🎧 Аудіо готове</span>';
            } else if (book.is_complete) {
                statusBadge = '<span class="status-badge complete">✓ Готово до озвучення</span>';
            } else {
                statusBadge = '<span class="status-badge processing">⏳ В обробці</span>';
            }

            const createdDate = new Date(book.created_at).toLocaleDateString('uk-UA', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            card.innerHTML = `
                <div class="book-header">
                    <div class="book-title">${book.title || 'Без назви'}</div>
                    ${book.description ? `<div class="book-description">${book.description}</div>` : ''}
                </div>

                <div class="book-meta">
                    <span class="meta-badge language">${languageNames[book.language] || book.language}</span>
                    <span class="meta-badge provider">${providerNames[book.tts_provider] || book.tts_provider}</span>
                    ${book.tts_voice ? `<span class="meta-badge">${book.tts_voice}</span>` : ''}
                </div>

                <div class="progress-section">
                    <div class="progress-label">Прогрес: ${book.processed_pages}/${book.total_pages} сторінок</div>
                    <div class="progress-bar">
                        <div class="progress-fill ${progressClass}" style="width: ${progress}%"></div>
                    </div>
                </div>

                ${statusBadge}

                <div class="book-date">Створено: ${createdDate}</div>

                <div class="book-actions" style="margin-top: 15px;">
                    <a href="/ocr_tts/multipage/?doc=${book.id}" class="action-btn secondary">
                        ✏️ Редагувати
                    </a>
                    ${book.combined_text_url ? `
                        <a href="${book.combined_text_url}" class="action-btn primary" download>
                            📄 Текст
                        </a>
                    ` : ''}
                    ${book.combined_audio_url ? `
                        <a href="${book.combined_audio_url}" class="action-btn success" download>
                            🎧 Аудіо
                        </a>
                    ` : ''}
                </div>
            `;

            return card;
        }

        function showEmptyState(message) {
            const container = document.getElementById('booksContainer');
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📚</div>
                    <div class="empty-state-text">${message}</div>
                    <a href="/ocr_tts/multipage/" class="create-btn">Створити нову книгу</a>
                </div>
            `;
        }

        function setupFilters() {
            const filterBtns = document.querySelectorAll('.filter-btn');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Update active state
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    // Apply filter
                    currentFilter = btn.getAttribute('data-filter');
                    applyFilters();
                });
            });
        }

        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', () => {
                applyFilters();
            });
        }

        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            let filtered = allBooks;

            // Apply category filter
            if (currentFilter === 'complete') {
                filtered = filtered.filter(b => b.is_complete);
            } else if (currentFilter === 'processing') {
                filtered = filtered.filter(b => !b.is_complete);
            } else if (currentFilter === 'audio') {
                filtered = filtered.filter(b => b.audio_generated);
            }

            // Apply search filter
            if (searchTerm) {
                filtered = filtered.filter(b =>
                    (b.title && b.title.toLowerCase().includes(searchTerm)) ||
                    (b.description && b.description.toLowerCase().includes(searchTerm))
                );
            }

            renderBooks(filtered);
        }
    </script>
</body>
</html>
